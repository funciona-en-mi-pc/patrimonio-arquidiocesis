spring.application.name=patrimonio-backend
server.port=8080

# Base de datos H2 en memoria (se crea al iniciar; en la etapa 3 se cambia por MySQL/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:patrimonio
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Primero se crean las tablas (JPA) y después se cargan los datos de data.sql
spring.jpa.defer-datasource-initialization=true
